<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDZip Editor Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #1f2328;
    }

    .demo-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 12px;
      border-bottom: 1px solid #d0d7de;
      flex: 0 0 auto;
      min-height: 36px;
    }

    .demo-header h1 { font-size: 13px; font-weight: 600; margin-right: 4px; }

    .tab-group {
      display: inline-flex;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      overflow: hidden;
    }

    .tab-btn {
      padding: 3px 10px;
      font-size: 12px;
      font-family: inherit;
      border: none;
      border-left: 1px solid #d0d7de;
      background: transparent;
      cursor: pointer;
      color: #57606a;
      line-height: 1.5;
    }

    .tab-btn:first-child { border-left: none; }

    .tab-btn.active {
      background: #0969da;
      color: #ffffff;
      font-weight: 500;
    }

    .demo-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      padding: 4px 0;
    }

    .demo-controls button,
    .demo-controls label {
      padding: 3px 8px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    .demo-controls input[type="file"] { display: none; }
    .mode-label { font-size: 12px; font-weight: 500; color: #57606a; user-select: none; }
    #mode-desc { font-size: 12px; color: #57606a; white-space: nowrap; }
    #status { color: #57606a; font-size: 12px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #tab-panels { flex: 1; min-height: 0; position: relative; }

    .tab-panel {
      position: absolute;
      inset: 0;
      display: none;
    }

    .tab-panel.active { display: flex; }

    /* The mounted editor (and any wrapper element) must fill the panel. */
    .tab-panel > * {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
    }
  </style>
</head>
<body>
  <header class="demo-header">
    <h1>MDZip Editor</h1>

    <div class="tab-group" role="tablist">
      <button class="tab-btn active" role="tab" data-tab="raw">JS</button>
      <button class="tab-btn" role="tab" data-tab="diff">Diff</button>
      <button class="tab-btn" role="tab" data-tab="angular">Angular</button>
      <button class="tab-btn" role="tab" data-tab="react">React</button>
      <button class="tab-btn" role="tab" data-tab="vue">Vue</button>
    </div>

    <span class="mode-label">Mode</span>
    <div id="mode-group" class="tab-group" role="group" aria-label="Mode">
      <button class="tab-btn" data-preset="preview">Preview</button>
      <button class="tab-btn" data-preset="viewer">Viewer</button>
      <button class="tab-btn active" data-preset="standalone-editor">Standalone</button>
      <button class="tab-btn" data-preset="hosted-editor">Hosted</button>
    </div>

    <span id="mode-desc"></span>

    <div class="demo-controls">
      <label>Open .mdz or .md <input type="file" id="file-input" accept=".mdz,.md,.markdown" /></label>
      <span id="status">Loading sample...</span>
    </div>
  </header>

  <div id="tab-panels">
    <div id="tab-raw"     class="tab-panel active" role="tabpanel"></div>
    <div id="tab-diff"    class="tab-panel"        role="tabpanel"></div>
    <div id="tab-angular" class="tab-panel"        role="tabpanel"></div>
    <div id="tab-react"   class="tab-panel"        role="tabpanel"></div>
    <div id="tab-vue"     class="tab-panel"        role="tabpanel"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
