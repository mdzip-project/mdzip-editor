<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDZip Editor Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #1f2328;
    }

    .demo-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 12px;
      border-bottom: 1px solid #d0d7de;
      flex: 0 0 auto;
      min-height: 36px;
    }

    .demo-header h1 { font-size: 13px; font-weight: 600; margin-right: 4px; }

    .tab-group {
      display: flex;
      gap: 2px;
      padding: 4px 0;
    }

    .tab-btn {
      padding: 3px 10px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      cursor: pointer;
      color: #57606a;
    }

    .tab-btn.active {
      background: #0969da;
      border-color: #0969da;
      color: #ffffff;
      font-weight: 500;
    }

    .demo-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      padding: 4px 0;
    }

    .demo-controls button,
    .demo-controls label {
      padding: 3px 8px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    .demo-controls input[type="file"] { display: none; }
    #status { color: #57606a; font-size: 12px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #tab-panels { flex: 1; min-height: 0; position: relative; }

    .tab-panel {
      position: absolute;
      inset: 0;
      display: none;
    }

    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <header class="demo-header">
    <h1>MDZip Editor</h1>

    <div class="tab-group" role="tablist">
      <button class="tab-btn active" role="tab" data-tab="raw">Raw</button>
      <button class="tab-btn" role="tab" data-tab="angular">Angular</button>
      <button class="tab-btn" role="tab" data-tab="react">React</button>
      <button class="tab-btn" role="tab" data-tab="vue">Vue</button>
    </div>

    <div class="demo-controls">
      <button id="btn-editable">Editable</button>
      <button id="btn-readonly">Read Only</button>
      <label>Open .mdz <input type="file" id="file-input" accept=".mdz,.md" /></label>
      <button id="btn-download">Download</button>
      <span id="status">Loading sample...</span>
    </div>
  </header>

  <div id="tab-panels">
    <div id="tab-raw"     class="tab-panel active" role="tabpanel"></div>
    <div id="tab-angular" class="tab-panel"        role="tabpanel"></div>
    <div id="tab-react"   class="tab-panel"        role="tabpanel"></div>
    <div id="tab-vue"     class="tab-panel"        role="tabpanel"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
