<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDZip Editor Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #1f2328;
    }

    .demo-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 12px;
      border-bottom: 1px solid #d0d7de;
      flex: 0 0 auto;
      min-height: 36px;
    }

    .demo-header h1 { font-size: 13px; font-weight: 600; margin-right: 4px; }

    .tab-group {
      display: inline-flex;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      overflow: hidden;
    }

    .tab-btn {
      padding: 3px 10px;
      font-size: 12px;
      font-family: inherit;
      border: none;
      border-left: 1px solid #d0d7de;
      background: transparent;
      cursor: pointer;
      color: #57606a;
      line-height: 1.5;
    }

    .tab-btn:first-child { border-left: none; }

    .tab-btn.active {
      background: #0969da;
      color: #ffffff;
      font-weight: 500;
    }

    .demo-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      padding: 4px 0;
    }

    .demo-controls button,
    .demo-controls label {
      padding: 3px 8px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    .demo-controls input[type="file"] { display: none; }

    .demo-controls select {
      font: inherit;
      font-size: 12px;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .demo-controls .check-control {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .demo-controls .check-control input {
      margin: 0;
    }

    .icon-radio-group {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 3px 4px;
    }

    .icon-radio {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      cursor: pointer;
      color: #57606a;
      line-height: 1.5;
      user-select: none;
    }

    .icon-radio input[type="radio"] {
      margin: 0;
      cursor: pointer;
      accent-color: #0969da;
    }

    .icon-radio .btn-icon {
      width: 14px;
      height: 14px;
      display: inline-flex;
      flex: 0 0 auto;
    }

    .icon-radio .btn-icon svg { width: 100%; height: 100%; display: block; }

    .icon-radio:has(input:checked) {
      color: #0969da;
      font-weight: 600;
    }

    .mode-label { font-size: 12px; font-weight: 500; color: #57606a; user-select: none; }
    #mode-desc { font-size: 12px; color: #57606a; white-space: nowrap; }
    #status { color: #57606a; font-size: 12px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #tab-panels { flex: 1; min-height: 0; position: relative; }

    .tab-panel {
      position: absolute;
      inset: 0;
      display: none;
    }

    .tab-panel.active { display: flex; }

    /* The mounted editor (and any wrapper element) must fill the panel. */
    .tab-panel > * {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
    }
  </style>
</head>
<body>
  <header class="demo-header">
    <h1>MDZip Editor</h1>

    <div class="icon-radio-group" role="radiogroup" aria-label="Framework">
      <label class="icon-radio" title="JavaScript">
        <input type="radio" name="framework" value="raw" checked />
        <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 630 630" xmlns="http://www.w3.org/2000/svg"><rect width="630" height="630" rx="86" fill="#f7df1e"/><path d="m423.2 492.19c12.69 20.72 29.2 35.95 58.4 35.95 24.53 0 40.2-12.26 40.2-29.2 0-20.26-16.1-27.49-43.1-39.3l-14.8-6.35c-42.72-18.2-71.1-41-71.1-89.2 0-44.4 33.83-78.2 86.7-78.2 37.64 0 64.7 13.1 84.2 47.4l-46.1 29.6c-10.15-18.2-21.1-25.37-38.1-25.37-17.34 0-28.33 11-28.33 25.37 0 17.76 11 24.95 36.4 35.95l14.8 6.34c50.3 21.57 78.7 43.56 78.7 93 0 53.3-41.87 82.5-98.1 82.5-54.98 0-90.5-26.2-107.88-60.54zm-209.13 5.13c9.3 16.5 17.76 30.45 37.93 30.45 19.3 0 31.45-7.59 31.45-37.04v-200.3h59.2v201.2c0 61-35.77 88.7-87.95 88.7-47.2 0-74.59-24.52-88.64-54.07z" fill="#323330"/></svg></span>
        <span>JS</span>
      </label>
      <label class="icon-radio" title="Angular">
        <input type="radio" name="framework" value="angular" />
        <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg"><path d="M125 30L31.9 63.2l14.2 123.1L125 230l78.9-43.7 14.2-123.1z" fill="#dd0031"/><path d="M125 30v200l78.9-43.7 14.2-123.1z" fill="#c3002f"/><path d="M125 52.1L66.8 182.6h21.7l11.7-29.2h49.4l11.7 29.2H183L125 52.1zm17 80.5h-34l17-41z" fill="#fff"/></svg></span>
        <span>Angular</span>
      </label>
      <label class="icon-radio" title="Vue">
        <input type="radio" name="framework" value="vue" />
        <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 261.76 226.69" xmlns="http://www.w3.org/2000/svg"><path d="M161.096.001l-30.225 52.351L100.647.001H-.005l130.877 226.688L261.749.001z" fill="#41b883"/><path d="M161.096.001l-30.225 52.351L100.647.001H52.346l78.326 135.654L209 .001z" fill="#35495e"/></svg></span>
        <span>Vue</span>
      </label>
      <label class="icon-radio" title="React">
        <input type="radio" name="framework" value="react" />
        <span class="btn-icon" aria-hidden="true"><svg viewBox="-11.5 -10.232 23 20.463" xmlns="http://www.w3.org/2000/svg"><circle r="2.05" fill="#61dafb"/><g stroke="#61dafb" stroke-width="1" fill="none"><ellipse rx="11" ry="4.2"/><ellipse rx="11" ry="4.2" transform="rotate(60)"/><ellipse rx="11" ry="4.2" transform="rotate(120)"/></g></svg></span>
        <span>React</span>
      </label>
    </div>

    <span class="mode-label">Mode</span>
    <div id="mode-group" class="tab-group" role="group" aria-label="Mode">
      <button class="tab-btn" data-preset="preview">Preview</button>
      <button class="tab-btn" data-preset="viewer">Viewer</button>
      <button class="tab-btn active" data-preset="standalone-editor">Standalone</button>
      <button class="tab-btn" data-preset="hosted-editor">Hosted</button>
      <button class="tab-btn" data-preset="diff" title="Compare against a fixed sample using this framework's own Diff component">Diff</button>
    </div>

    <span id="mode-desc"></span>

    <div class="demo-controls">
      <label class="check-control">
        <input type="checkbox" id="line-numbers-toggle" checked />
        Line numbers
      </label>
      <label>
        Image insert
        <select id="image-insert-mode">
          <option value="markdown">Markdown</option>
          <option value="ask">Ask</option>
          <option value="html">HTML</option>
          <option value="host-html">Host HTML</option>
        </select>
      </label>
      <label>
        Open
        <select id="sample-select"></select>
      </label>
      <input type="file" id="file-input" accept=".mdz,.md,.markdown" style="display:none" />
      <span id="status">Loading sample...</span>
    </div>
  </header>

  <div id="tab-panels">
    <div id="tab-raw"     class="tab-panel active" role="tabpanel"></div>
    <div id="tab-angular" class="tab-panel"        role="tabpanel"></div>
    <div id="tab-react"   class="tab-panel"        role="tabpanel"></div>
    <div id="tab-vue"     class="tab-panel"        role="tabpanel"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
